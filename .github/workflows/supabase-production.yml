name: Deploy Supabase production

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/verify-supabase-production.mjs"
      - ".github/workflows/supabase-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_GN1ot7iq-QgbnHn5mUX2Zg_E5KFHIQu
      PRODUCTION_ORIGIN: https://juanheng-cashflow-engine.github.io

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_POOLER_URL SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              exit 1
            fi
          done

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Prepare IPv4 database endpoint
        shell: bash
        run: |
          database_url="$(node -e '
            const raw = process.env.SUPABASE_POOLER_URL.trim()
            const value = raw.replaceAll("[YOUR-PASSWORD]", "placeholder")
            const url = new URL(value)
            const expectedUser = `postgres.${process.env.SUPABASE_PROJECT_ID}`

            if (!["postgres:", "postgresql:"].includes(url.protocol)) {
              throw new Error("SUPABASE_POOLER_URL must be a Postgres URI")
            }
            if (!url.hostname.endsWith(".pooler.supabase.com")) {
              throw new Error("SUPABASE_POOLER_URL must use the Supabase pooler host")
            }
            if (url.port !== "5432") {
              throw new Error("SUPABASE_POOLER_URL must use Session pooler port 5432")
            }
            if (decodeURIComponent(url.username) !== expectedUser) {
              throw new Error("SUPABASE_POOLER_URL does not match SUPABASE_PROJECT_ID")
            }

            url.password = process.env.SUPABASE_DB_PASSWORD
            process.stdout.write(url.toString())
          ')"
          if [ -z "$database_url" ]; then
            echo "::error::Failed to prepare the Supabase IPv4 database endpoint"
            exit 1
          fi
          echo "::add-mask::$database_url"
          echo "SUPABASE_DB_URL=$database_url" >> "$GITHUB_ENV"

      - name: Inspect migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview database changes
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: List deployed Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify production RLS and public function boundary
        env:
          SUPABASE_PROJECT_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-supabase-production.mjs



